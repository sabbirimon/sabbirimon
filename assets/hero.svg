<?xml version="1.0" encoding="UTF-8"?>
<!--
  hero.svg — animated aurora hero banner for the ReadMe.
  Pure SVG + SMIL (works in GitHub's image proxy for static SVGs).
  Aurora gradient cycles cyan → purple → magenta → cyan, glass orbs breathe,
  glass card carries "Sabbirimon".
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220"
     preserveAspectRatio="xMidYMid meet"
     role="img" aria-label="Sabbirimon — DevOps engineer · 5G/RAN explorer · Open-source tinkerer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#030712"/>
      <stop offset="50%"  stop-color="#0a0a1f"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#22d3ee">
        <animate attributeName="stop-color"
                 values="#22d3ee;#a855f7;#ec4899;#22d3ee"
                 dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%"  stop-color="#a855f7">
        <animate attributeName="stop-color"
                 values="#a855f7;#ec4899;#22d3ee;#a855f7"
                 dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ec4899">
        <animate attributeName="stop-color"
                 values="#ec4899;#22d3ee;#a855f7;#ec4899"
                 dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#22d3ee"/>
      <stop offset="50%"  stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 L0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="720" height="220" fill="url(#bg)"/>
  <rect width="720" height="220" fill="url(#grid)"/>

  <!-- Aurora band -->
  <ellipse cx="360" cy="110" rx="420" ry="80" fill="url(#aurora)" opacity="0.35">
    <animate attributeName="opacity" values="0.25;0.45;0.25" dur="6s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Glass orbs -->
  <circle cx="120" cy="60"  r="48" fill="#22d3ee" opacity="0.18">
    <animate attributeName="r" values="44;52;44" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="170" r="42" fill="#a855f7" opacity="0.18">
    <animate attributeName="r" values="38;48;38" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="640" cy="50"  r="22" fill="#ec4899" opacity="0.22">
    <animate attributeName="r" values="18;28;18" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="80"  cy="170" r="28" fill="#84cc16" opacity="0.18">
    <animate attributeName="r" values="24;32;24" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- Glass card -->
  <rect x="120" y="50" width="480" height="120" rx="18" ry="18"
        fill="url(#card)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
  <rect x="120" y="50" width="480" height="120" rx="18" ry="18"
        fill="none" stroke="url(#aurora)" stroke-width="1" opacity="0.5"/>

  <!-- Eyebrow -->
  <text x="360" y="92" text-anchor="middle"
        font-family="ui-monospace, Menlo, monospace" font-size="11"
        letter-spacing="3" fill="#ffffff" fill-opacity="0.6">HI, I'M</text>

  <!-- Name -->
  <text x="360" y="135" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, sans-serif" font-weight="800"
        font-size="40" fill="url(#name)" filter="url(#glow)">Sabbirimon</text>

  <!-- Tagline -->
  <text x="360" y="158" text-anchor="middle"
        font-family="ui-monospace, Menlo, monospace" font-size="11"
        fill="#ffffff" fill-opacity="0.7">DevOps engineer · 5G/RAN explorer · Open-source tinkerer</text>
</svg>