<?xml version="1.0" encoding="UTF-8"?>
<!--
  radio-waves.svg — animated broadcast tower with expanding signal arcs.
  Pure SVG + SMIL. Width 320, height 320.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320"
     preserveAspectRatio="xMidYMid meet"
     role="img" aria-label="Broadcast tower with expanding signal arcs and data packets">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#030712"/>
      <stop offset="100%" stop-color="#0a0a1f"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="320" height="320" fill="url(#sky)"/>

  <!-- Halo behind tower -->
  <circle cx="160" cy="160" r="80" fill="url(#halo)">
    <animate attributeName="r" values="60;90;60" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 6 concentric signal arcs, staggered -->
  <g fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round">
    <circle cx="160" cy="160" r="40" opacity="0">
      <animate attributeName="r" from="20" to="160" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="160" r="40" opacity="0">
      <animate attributeName="r" from="20" to="160" dur="4s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="4s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="160" r="40" opacity="0">
      <animate attributeName="r" from="20" to="160" dur="4s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="4s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="160" r="40" opacity="0">
      <animate attributeName="r" from="20" to="160" dur="4s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="4s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="160" r="40" opacity="0">
      <animate attributeName="r" from="20" to="160" dur="4s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="4s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="160" r="40" opacity="0">
      <animate attributeName="r" from="20" to="160" dur="4s" begin="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="4s" begin="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Broadcast tower (lattice) -->
  <g stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="140" y1="240" x2="160" y2="120"/>
    <line x1="180" y1="240" x2="160" y2="120"/>
    <line x1="150" y1="200" x2="170" y2="200"/>
    <line x1="145" y1="170" x2="175" y2="170"/>
    <line x1="160" y1="120" x2="160" y2="50" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="160" cy="48" r="3" fill="#22d3ee">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Signal-strength bars bottom-left -->
  <g fill="#22d3ee">
    <rect x="40" y="270" width="6" height="10">
      <animate attributeName="height" values="4;10;4" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="276;270;276" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="50" y="260" width="6" height="20">
      <animate attributeName="height" values="10;20;10" dur="2s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="270;260;270" dur="2s" begin="0.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="60" y="250" width="6" height="30">
      <animate attributeName="height" values="16;30;16" dur="2s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="264;250;264" dur="2s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="70" y="240" width="6" height="40">
      <animate attributeName="height" values="22;40;22" dur="2s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="258;240;258" dur="2s" begin="0.9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Frequency display -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#ffffff" fill-opacity="0.8">
    <rect x="220" y="240" width="78" height="36" rx="6" ry="6"
          fill="#ffffff" fill-opacity="0.05" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="259" y="258" text-anchor="middle">FREQ</text>
    <text x="259" y="272" text-anchor="middle" font-size="13" font-weight="700" fill="#22d3ee">3.5 GHz</text>
  </g>
</svg>