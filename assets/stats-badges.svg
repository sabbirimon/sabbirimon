<?xml version="1.0" encoding="UTF-8"?>
<!--
  stats-badges.svg — glassmorphic pill row: FOLLOWERS · STARS · WATCHERS · VIEWS.
  Animated counters (pure SVG + SMIL).
  Width 760, height 64.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 64"
     preserveAspectRatio="xMidYMid meet"
     role="img" aria-label="FOLLOWERS · STARS · WATCHERS · VIEWS animated counters">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="strike" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#22d3ee"/>
      <stop offset="50%"  stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <g font-family="ui-monospace, Menlo, monospace" font-size="14" font-weight="700">
    <!-- Pill 1: FOLLOWERS -->
    <rect x="6"   y="12" width="180" height="40" rx="20" ry="20" fill="url(#bg)" stroke="url(#strike)" stroke-width="1"/>
    <text x="96"  y="37" text-anchor="middle" fill="#22d3ee">FOLLOWERS</text>
    <text x="170" y="37" text-anchor="end" fill="#ffffff" id="followerCount" data-target="0">0</text>

    <!-- Pill 2: STARS -->
    <rect x="196" y="12" width="180" height="40" rx="20" ry="20" fill="url(#bg)" stroke="url(#strike)" stroke-width="1"/>
    <text x="286" y="37" text-anchor="middle" fill="#a855f7">STARS</text>
    <text x="360" y="37" text-anchor="end" fill="#ffffff">—</text>

    <!-- Pill 3: WATCHERS -->
    <rect x="386" y="12" width="180" height="40" rx="20" ry="20" fill="url(#bg)" stroke="url(#strike)" stroke-width="1"/>
    <text x="476" y="37" text-anchor="middle" fill="#ec4899">WATCHERS</text>
    <text x="550" y="37" text-anchor="end" fill="#ffffff">—</text>

    <!-- Pill 4: VIEWS -->
    <rect x="576" y="12" width="178" height="40" rx="20" ry="20" fill="url(#bg)" stroke="url(#strike)" stroke-width="1"/>
    <text x="666" y="37" text-anchor="middle" fill="#84cc16">VIEWS</text>
    <text x="740" y="37" text-anchor="end" fill="#ffffff">—</text>
  </g>

  <!-- Subtle pulse on the stroke -->
  <g fill="none" stroke-width="1">
    <rect x="6"   y="12" width="180" height="40" rx="20" ry="20" stroke="#22d3ee" stroke-opacity="0">
      <animate attributeName="stroke-opacity" values="0;0.4;0" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="196" y="12" width="180" height="40" rx="20" ry="20" stroke="#a855f7" stroke-opacity="0">
      <animate attributeName="stroke-opacity" values="0;0.4;0" dur="4s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="386" y="12" width="180" height="40" rx="20" ry="20" stroke="#ec4899" stroke-opacity="0">
      <animate attributeName="stroke-opacity" values="0;0.4;0" dur="4s" begin="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="576" y="12" width="178" height="40" rx="20" ry="20" stroke="#84cc16" stroke-opacity="0">
      <animate attributeName="stroke-opacity" values="0;0.4;0" dur="4s" begin="3s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>