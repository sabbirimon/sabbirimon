  <g font-family="'Courier New',monospace" font-weight="900">
    <text x="240" y="66" font-size="18" letter-spacing="5" fill="#ff82e7">IMON ARCADE</text>
    <text x="242" y="132" font-size="60" letter-spacing="1" fill="#070b20">PLAY GAMES</text>
