<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" role="img" aria-labelledby="play-title play-description">
  <title id="play-title">Play Games — IMON Arcade</title>
  <desc id="play-description">A bright cyan and magenta pixel controller beside Play Games. Snake, Ludo, Racing, and Gridworks.</desc>
  <defs>
    <linearGradient id="arcade-border" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#34efff"/>
      <stop offset=".48" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ff49dc"/>
    </linearGradient>
    <linearGradient id="arcade-face" x1="0" x2="1">
      <stop stop-color="#14254b"/>
      <stop offset="1" stop-color="#211240"/>
    </linearGradient>
    <style>
      .spark { animation: arcade-spark 2.8s steps(2,end) infinite; }
      .spark-late { animation-delay: 1.4s; }
      .arrow { animation: arcade-nudge 2.8s steps(2,end) infinite; }
      @keyframes arcade-spark { 0%,70%,100% {opacity:1} 75%,90% {opacity:.3} }
      @keyframes arcade-nudge { 0%,60%,100% {transform:translateX(0)} 70%,85% {transform:translateX(6px)} }
      @media (prefers-reduced-motion:reduce) { .spark,.arrow { animation:none; } }
    </style>
  </defs>
  <path fill="#050919" d="M24 0h832v12h12v12h12v192h-12v12h-12v12H24v-12H12v-12H0V24h12V12h12z"/>
