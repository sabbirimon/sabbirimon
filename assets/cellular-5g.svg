<?xml version="1.0" encoding="UTF-8"?>
<!--
  cellular-5g.svg — three macro towers with sector antennas + handover arcs.
  Pure SVG + SMIL. Width 1100, height 380. Replaces cellular-5g.gif.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380"
     preserveAspectRatio="xMidYMid meet"
     role="img" aria-label="5G / Cellular RAN — three macro towers with rotating sector antennas and handover arcs">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#030712"/>
      <stop offset="100%" stop-color="#0a0a1f"/>
    </linearGradient>
    <linearGradient id="arcg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="arcg2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="towerGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1100" height="380" fill="url(#sky2)"/>

  <!-- ground line -->
  <line x1="0" y1="330" x2="1100" y2="330" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1"/>

  <!-- Tower helper template via 3 groups -->
  <g id="t1" transform="translate(180 0)">
    <ellipse cx="0" cy="220" rx="80" ry="40" fill="url(#towerGlow)"/>
    <!-- Lattice legs -->
    <line x1="-30" y1="320" x2="-12" y2="160" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2"/>
    <line x1="30"  y1="320" x2="12"  y2="160" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2"/>
    <line x1="-22" y1="260" x2="22" y2="260" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1"/>
    <line x1="-18" y1="220" x2="18" y2="220" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1"/>
    <line x1="-14" y1="190" x2="14" y2="190" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1"/>
    <!-- Antenna spire -->
    <line x1="0" y1="160" x2="0" y2="80" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="0" cy="76" r="3" fill="#22d3ee">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <!-- Sector beam -->
    <g fill="#22d3ee" fill-opacity="0.10" stroke="#22d3ee" stroke-opacity="0.5">
      <path d="M0 76 L60 100 L60 116 L0 92 Z"/>
      <path d="M0 76 L-60 100 L-60 116 L0 92 Z"/>
    </g>
    <!-- sector rotation hint -->
    <g>
      <line x1="0" y1="76" x2="50" y2="100" stroke="#22d3ee" stroke-width="1" stroke-dasharray="3 3">
        <animateTransform attributeName="transform" type="rotate"
                          from="0 0 76" to="30 0 76" dur="3s" repeatCount="indefinite"/>
      </line>
      <line x1="0" y1="76" x2="-50" y2="100" stroke="#22d3ee" stroke-width="1" stroke-dasharray="3 3">
        <animateTransform attributeName="transform" type="rotate"
                          from="-30 0 76" to="0 0 76" dur="3s" repeatCount="indefinite"/>
      </line>
    </g>
    <!-- Label -->
    <text x="0" y="50" text-anchor="middle" font-family="ui-monospace, Menlo, monospace"
          font-size="14" font-weight="700" fill="#22d3ee">gNB-01</text>
  </g>

  <g id="t2" transform="translate(550 0)">
    <ellipse cx="0" cy="220" rx="80" ry="40" fill="url(#towerGlow)"/>
    <line x1="-30" y1="320" x2="-12" y2="160" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2"/>
    <line x1="30"  y1="320" x2="12"  y2="160" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2"/>
    <line x1="-22" y1="260" x2="22" y2="260" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1"/>
    <line x1="-18" y1="220" x2="18" y2="220" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1"/>
    <line x1="-14" y1="190" x2="14" y2="190" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1"/>
    <line x1="0" y1="160" x2="0" y2="80" stroke="#a855f7" stroke-width="2"/>
    <circle cx="0" cy="76" r="3" fill="#a855f7">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.2s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <g fill="#a855f7" fill-opacity="0.10" stroke="#a855f7" stroke-opacity="0.5">
      <path d="M0 76 L60 100 L60 116 L0 92 Z"/>
      <path d="M0 76 L-60 100 L-60 116 L0 92 Z"/>
    </g>
    <text x="0" y="50" text-anchor="middle" font-family="ui-monospace, Menlo, monospace"
          font-size="14" font-weight="700" fill="#a855f7">gNB-02</text>
  </g>

  <g id="t3" transform="translate(920 0)">
    <ellipse cx="0" cy="220" rx="80" ry="40" fill="url(#towerGlow)"/>
    <line x1="-30" y1="320" x2="-12" y2="160" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2"/>
    <line x1="30"  y1="320" x2="12"  y2="160" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2"/>
    <line x1="-22" y1="260" x2="22" y2="260" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1"/>
    <line x1="-18" y1="220" x2="18" y2="220" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1"/>
    <line x1="-14" y1="190" x2="14" y2="190" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1"/>
    <line x1="0" y1="160" x2="0" y2="80" stroke="#ec4899" stroke-width="2"/>
    <circle cx="0" cy="76" r="3" fill="#ec4899">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.2s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <g fill="#ec4899" fill-opacity="0.10" stroke="#ec4899" stroke-opacity="0.5">
      <path d="M0 76 L60 100 L60 116 L0 92 Z"/>
      <path d="M0 76 L-60 100 L-60 116 L0 92 Z"/>
    </g>
    <text x="0" y="50" text-anchor="middle" font-family="ui-monospace, Menlo, monospace"
          font-size="14" font-weight="700" fill="#ec4899">gNB-03</text>
  </g>

  <!-- Handover arcs between towers -->
  <path d="M180 80 Q365 30 550 80" fill="none" stroke="url(#arcg)" stroke-width="1.5" stroke-dasharray="6 4" opacity="0">
    <animate attributeName="opacity" values="0;0.8;0" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-dashoffset" from="0" to="-100" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M550 80 Q735 30 920 80" fill="none" stroke="url(#arcg2)" stroke-width="1.5" stroke-dasharray="6 4" opacity="0">
    <animate attributeName="opacity" values="0;0.8;0" dur="3s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="stroke-dashoffset" from="0" to="-100" dur="3s" begin="1s" repeatCount="indefinite"/>
  </path>

  <!-- Data packet along arc 1 -->
  <circle r="4" fill="#22d3ee" filter="url(#none)">
    <animateMotion dur="3s" repeatCount="indefinite"
                   path="M180 80 Q365 30 550 80"/>
  </circle>
  <circle r="4" fill="#a855f7">
    <animateMotion dur="3s" begin="1.5s" repeatCount="indefinite"
                   path="M550 80 Q735 30 920 80"/>
  </circle>

  <!-- Mobile UE device -->
  <g transform="translate(360 280)">
    <rect x="-22" y="-32" width="44" height="68" rx="6" ry="6"
          fill="#ffffff" fill-opacity="0.06" stroke="#22d3ee" stroke-width="1.5"/>
    <rect x="-18" y="-26" width="36" height="48" rx="2" ry="2"
          fill="#22d3ee" fill-opacity="0.15"/>
    <circle cx="0" cy="30" r="2" fill="#22d3ee"/>
    <text x="0" y="48" text-anchor="middle" font-family="ui-monospace, Menlo, monospace"
          font-size="9" fill="#22d3ee">UE</text>
  </g>

  <!-- URLLC badge -->
  <g transform="translate(720 280)">
    <rect x="-40" y="-14" width="80" height="28" rx="14" ry="14"
          fill="#ffffff" fill-opacity="0.06" stroke="#84cc16" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" font-family="ui-monospace, Menlo, monospace"
          font-size="13" font-weight="700" fill="#84cc16">URLLC · 1ms</text>
  </g>

  <!-- 5GC core label -->
  <g transform="translate(990 280)">
    <rect x="-50" y="-14" width="100" height="28" rx="6" ry="6"
          fill="#ffffff" fill-opacity="0.06" stroke="#a855f7" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" font-family="ui-monospace, Menlo, monospace"
          font-size="12" font-weight="700" fill="#a855f7">5GC CORE</text>
  </g>
</svg>