<?xml version="1.0" encoding="UTF-8"?>
<!--
  sabbirimon — Hero banner (STATIC — GitHub-image-proxy safe)
  ────────────────────────────────────────────────────────────────
  No <style>, no <animate>, no <script>. GitHub's image proxy
  (camo.githubusercontent.com) strips SMIL + script + most style.
  This file is intentionally static so it renders consistently
  everywhere — github.com, sabbirimon.github.io, raw CDN, etc.

  Apple-style glass card on top of an aurora gradient backdrop.
  All animations live on the docs/index.html landing instead.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1280 400"
     width="100%" preserveAspectRatio="xMidYMid slice"
     role="img" aria-label="Sabbirimon — DevOps engineer · 5G/RAN explorer · Open-source tinkerer"
     font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', ui-sans-serif, system-ui, Segoe UI, Roboto, Inter, Helvetica, Arial, sans-serif">

  <defs>
    <!-- Static aurora gradient -->
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#06b6d4"/>
      <stop offset="35%"  stop-color="#a855f7"/>
      <stop offset="70%"  stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <!-- Glass card border -->
    <linearGradient id="glassBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.55)"/>
      <stop offset="50%"  stop-color="rgba(255,255,255,0.10)"/>
      <stop offset="100%" stop-color="rgba(168,85,247,0.55)"/>
    </linearGradient>

    <!-- Orb gradients (static, but layered for depth) -->
    <radialGradient id="orbCyan" cx="35%" cy="30%" r="70%">
      <stop offset="0%"  stop-color="#a5f3fc"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </radialGradient>
    <radialGradient id="orbPurple" cx="35%" cy="30%" r="70%">
      <stop offset="0%"  stop-color="#e9d5ff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </radialGradient>
    <radialGradient id="orbPink" cx="35%" cy="30%" r="70%">
      <stop offset="0%"  stop-color="#fbcfe8"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#9d174d"/>
    </radialGradient>
    <radialGradient id="orbLime" cx="35%" cy="30%" r="70%">
      <stop offset="0%"  stop-color="#d9f99d"/>
      <stop offset="50%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#3f6212"/>
    </radialGradient>

    <!-- Name gradient (Apple-style cyan→purple→pink) -->
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#67e8f9"/>
      <stop offset="50%"  stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <!-- Vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="65%">
      <stop offset="0%"   stop-color="#000" stop-opacity="0"/>
      <stop offset="70%"  stop-color="#000" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.9"/>
    </radialGradient>

    <!-- Glow filter for the name -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Orb glow blur -->
    <filter id="orbBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>

    <!-- Mesh pattern -->
    <pattern id="grid" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none"
            stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background: deep navy -->
  <rect x="0" y="0" width="1280" height="400" fill="#050514"/>

  <!-- Aurora layer -->
  <rect x="0" y="0" width="1280" height="400" fill="url(#aurora)" opacity="0.95"/>

  <!-- Mesh grid -->
  <rect x="0" y="0" width="1280" height="400" fill="url(#grid)"/>

  <!-- Glass orbs (static) -->
  <g filter="url(#orbBlur)" opacity="0.85">
    <circle cx="180"  cy="120" r="90"  fill="url(#orbCyan)"/>
    <circle cx="1080" cy="320" r="120" fill="url(#orbPurple)"/>
    <circle cx="640"  cy="380" r="140" fill="url(#orbPink)" opacity="0.7"/>
  </g>

  <!-- Small accent orb (top-right, lime) -->
  <circle cx="1180" cy="80" r="40" fill="url(#orbLime)" opacity="0.8" filter="url(#orbBlur)"/>

  <!-- Vignette -->
  <rect x="0" y="0" width="1280" height="400" fill="url(#vignette)"/>

  <!-- Glass card -->
  <g transform="translate(640 200)">
    <!-- Outer card -->
    <rect x="-380" y="-110" width="760" height="220" rx="28"
          fill="rgba(255,255,255,0.06)"
          stroke="url(#glassBorder)" stroke-width="1.4"/>
    <!-- Inner highlight band -->
    <rect x="-378" y="-108" width="756" height="40" rx="26"
          fill="url(#aurora)" opacity="0.20"/>

    <!-- Eyebrow -->
    <text x="0" y="-58" text-anchor="middle"
          font-size="18" letter-spacing="6"
          fill="rgba(255,255,255,0.85)" font-weight="600">
      HI, I'M
    </text>

    <!-- Big name -->
    <text x="0" y="0" text-anchor="middle"
          font-size="78" font-weight="900"
          fill="url(#nameGrad)" filter="url(#softGlow)">
      Sabbirimon
    </text>

    <!-- Subline -->
    <text x="0" y="44" text-anchor="middle"
          font-size="22" font-weight="500"
          fill="rgba(255,255,255,0.92)">
      DevOps engineer · 5G/RAN explorer · Open-source tinkerer
    </text>

    <!-- Tag chips -->
    <g transform="translate(0 80)" font-size="13" font-weight="600">
      <rect x="-220" y="-14" width="80"  height="26" rx="13"
            fill="rgba(34,211,238,0.20)" stroke="#22d3ee" stroke-width="1"/>
      <text x="-180" y="4" text-anchor="middle" fill="#67e8f9">DevOps</text>

      <rect x="-126" y="-14" width="86"  height="26" rx="13"
            fill="rgba(168,85,247,0.20)" stroke="#a855f7" stroke-width="1"/>
      <text x="-83" y="4" text-anchor="middle" fill="#c084fc">5G / RAN</text>

      <rect x="-26"  y="-14" width="90"  height="26" rx="13"
            fill="rgba(236,72,153,0.20)" stroke="#ec4899" stroke-width="1"/>
      <text x="19" y="4" text-anchor="middle" fill="#f472b6">Open-source</text>

      <rect x="78"   y="-14" width="142" height="26" rx="13"
            fill="rgba(132,204,22,0.20)" stroke="#84cc16" stroke-width="1"/>
      <text x="149" y="4" text-anchor="middle" fill="#a3e635">GSM·LTE·5G·K8s</text>
    </g>
  </g>

  <!-- Subtle film grain via overlay -->
  <rect x="0" y="0" width="1280" height="400" fill="#000" opacity="0.15"/>
</svg>